
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-web
  template:
    metadata:
      labels:
        app: taskflow-web
    spec:
      containers:
        - name: taskflow-web
          image: taskflow-web:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: taskflow
            - name: DB_USER
              value: taskflow
            - name: DB_PASSWORD
              value: taskflow123
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-web
spec:
  type: NodePort
  selector:
    app: taskflow-web
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
